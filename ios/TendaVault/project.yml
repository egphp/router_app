name: TendaVault
options:
  bundleIdPrefix: com.tveg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 9SDH6224ZX
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SDKROOT: iphoneos
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    INFOPLIST_KEY_CFBundleDisplayName: "تندا"
    GENERATE_INFOPLIST_FILE: NO
packages:
  OwnerDeviceAuth:
    path: ../../../native/ios-shared/OwnerDeviceAuth
targets:
  TendaVault:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - Info.plist
          - "*.entitlements"
          - PrivacyInfo.xcprivacy
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: OwnerDeviceAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tveg.tendavault
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/TendaVault.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "تندا"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Tenda Vault AppStore"
schemes:
  TendaVault:
    build:
      targets:
        TendaVault: all
    run:
      config: Debug
    archive:
      config: Release
